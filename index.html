<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@500&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: #fff;
               overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; transition: filter 3s ease, transform 3s ease; }
  /* Al aparecer el título, la foto de fondo se va nublando y oscureciendo */
  #stage.blur { filter: blur(26px) brightness(.5); transform: scale(1.12); }
  /* Cada foto o video vive en su "placa": la copia desenfocada de fondo + la imagen */
  .slot { position: absolute; inset: 0; overflow: hidden; opacity: 0; visibility: hidden; z-index: 0;
          backface-visibility: hidden; will-change: opacity, transform; }
  .slot.front { opacity: 1; visibility: visible; z-index: 2; }
  .slot.back  { opacity: 1; visibility: visible; z-index: 1; }
  .layer { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: contain; backface-visibility: hidden; }
  /* Copia desenfocada que rellena las franjas de los costados (en los videos, una versión en vivo del cuadro) */
  .bg, .vamb { position: absolute; z-index: 0; left: -8%; top: -8%; width: 116%; height: 116%; background-size: cover; background-position: center;
               filter: blur(42px) brightness(.42) saturate(1.25); }
  /* Sombra suave alrededor de la foto para despegarla del fondo */
  .slot::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
                 box-shadow: inset 0 0 120px rgba(0,0,0,.45); }
  /* En pausa, también se frenan el zoom y las transiciones */
  .paused .layer, .paused .slot { animation-play-state: paused !important; }

  /* ---- Transiciones de entrada (la foto nueva aparece encima de la anterior) ---- */
  @keyframes tDissolve { from { opacity: 0; filter: blur(10px) brightness(1.2); } to { opacity: 1; filter: none; } }
  @keyframes tZoom { from { opacity: 0; transform: scale(1.16); filter: blur(16px) brightness(1.15); } 55% { opacity: 1; } to { opacity: 1; transform: none; filter: none; } }
  @keyframes tRise { from { opacity: 0; transform: translateY(5%) scale(1.04); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes tIris { from { clip-path: circle(0% at 50% 50%); filter: brightness(1.3); } to { clip-path: circle(75% at 50% 50%); filter: none; } }
  @keyframes tWipeL { from { -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 60%); mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
                             -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: 100% 0; mask-position: 100% 0; }
                      to   { -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 60%); mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
                             -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: 0 0; mask-position: 0 0; } }
  @keyframes tWipeR { from { -webkit-mask-image: linear-gradient(270deg, #000 40%, transparent 60%); mask-image: linear-gradient(270deg, #000 40%, transparent 60%);
                             -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: 0 0; mask-position: 0 0; }
                      to   { -webkit-mask-image: linear-gradient(270deg, #000 40%, transparent 60%); mask-image: linear-gradient(270deg, #000 40%, transparent 60%);
                             -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: 100% 0; mask-position: 100% 0; } }
  /* La foto que se va se hunde un poco y se desenfoca debajo de la nueva */
  @keyframes tOut { to { transform: scale(1.05); filter: blur(5px) brightness(.75); } }
  /* Zoom lento de cada foto (cada una con su propio recorrido) */
  @keyframes kb { from { transform: scale(var(--s0, 1)) translate(var(--x0, 0), var(--y0, 0)); }
                  to   { transform: scale(var(--s1, 1.1)) translate(var(--x1, 0), var(--y1, 0)); } }
  /* Luz de película que cruza la pantalla en algunas transiciones */
  #leak { position: fixed; inset: -20%; pointer-events: none; z-index: 3; opacity: 0; mix-blend-mode: screen;
          background: radial-gradient(ellipse 35% 55% at 30% 45%, rgba(255,150,60,.85), transparent 70%),
                      radial-gradient(ellipse 25% 40% at 62% 60%, rgba(255,70,40,.55), transparent 70%); }
  #leak.on { animation: leak 1.7s ease-in-out; }
  @keyframes leak { 0% { opacity: 0; transform: translateX(-25%); } 35% { opacity: .8; } 100% { opacity: 0; transform: translateX(25%); } }

  /* ---- Ráfaga: cortes secos con golpe de zoom y fogonazo de luz ---- */
  @keyframes burstPopA { 0% { transform: scale(1.13) rotate(-.8deg) translateX(-.6%); filter: brightness(1.35) contrast(1.15) saturate(1.2); }
                         35% { transform: scale(1.03) rotate(-.2deg); filter: brightness(1.08); }
                         100% { transform: none; filter: none; } }
  @keyframes burstPopB { 0% { transform: scale(1.13) rotate(.8deg) translateX(.6%); filter: brightness(1.35) contrast(1.15) saturate(1.2); }
                         35% { transform: scale(1.03) rotate(.2deg); filter: brightness(1.08); }
                         100% { transform: none; filter: none; } }
  /* Montaje final: golpe sin separación de color (va demasiado rápido) */
  @keyframes montPop { from { transform: scale(1.06); } to { transform: none; } }
  /* Durante la ráfaga la viñeta late con cada corte */
  #vignette.beat { animation: vBeat .3s ease-out; }
  @keyframes vBeat { from { opacity: .4; } to { opacity: 1; } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
  #flash.on { animation: flashSm .22s ease-out; }
  #flash.big { animation: flashBig 1.1s ease-out; }
  @keyframes flashSm { from { opacity: .26; } to { opacity: 0; } }
  @keyframes flashBig { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  /* Grano de película muy suave */
  #grain { position: fixed; inset: -50%; pointer-events: none; z-index: 3; opacity: .06;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
           animation: grain .7s steps(6) infinite; }
  @keyframes grain { 0% { transform: translate(0,0); } 20% { transform: translate(-5%,3%); } 40% { transform: translate(4%,-4%); } 60% { transform: translate(-3%,5%); } 80% { transform: translate(5%,2%); } 100% { transform: translate(0,0); } }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0b0b; z-index: 10; cursor: pointer; transition: opacity .9s ease; }
  #start.hide { opacity: 0; pointer-events: none; }
  #start.loading { cursor: progress; }
  #start.loading .btn { opacity: .25; pointer-events: none; }
  #start h1 { margin: 0; font-weight: 300; letter-spacing: .3em; text-transform: uppercase; font-size: clamp(1.6rem, 5vw, 3.4rem); }
  #start .btn { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; transition: transform .2s, background .2s; }
  #start:hover .btn { transform: scale(1.08); background: rgba(255,255,255,.12); }
  #start .btn::after { content: ""; border-left: 26px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 8px; }
  #start small { opacity: .55; }
  #warn { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: none; z-index: 7; width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; background: rgba(0,0,0,.75); border: 1px solid rgba(255,255,255,.35); padding: 10px 18px; border-radius: 8px; font-size: 15px; text-align: center; }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; width: 0; background: #fff; opacity: .8; z-index: 5; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; box-sizing: border-box;
              padding: 40px calc(24px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
              pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: center;
              background: linear-gradient(180deg, transparent, rgba(0,0,0,.45) 45%, rgba(0,0,0,.8)); opacity: 0; transition: opacity .35s ease; z-index: 6;
              font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #controls .row { width: min(100%, 1100px); display: flex; gap: 4px; align-items: center; }
  #controls .grow { flex: 1; }
  body.active #controls { opacity: 1; pointer-events: auto; }
  body.idle #controls { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  #controls button { position: relative; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
                     background: transparent; color: #fff; cursor: pointer; transition: background .2s, transform .12s; }
  #controls button:hover { background: rgba(255,255,255,.14); }
  #controls button:active { transform: scale(.92); }
  #controls button svg { width: 24px; height: 24px; fill: currentColor; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  #controls #pp { width: 52px; height: 52px; background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #controls #pp:hover { background: rgba(255,255,255,.24); }
  #controls #pp svg { width: 28px; height: 28px; }
  #seek { width: min(100%, 1100px); height: 22px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  #seekTrack { position: relative; width: 100%; height: 4px; background: rgba(255,255,255,.22); border-radius: 4px; transition: height .15s; }
  #seek:hover #seekTrack { height: 6px; }
  #seekFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ffd28a, #fff); border-radius: 4px; }
  #seekFill::after { content: ""; position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%;
                     background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.5); transform: scale(0); transition: transform .15s; }
  #seek:hover #seekFill::after, #seek:active #seekFill::after { transform: scale(1); }
  #time { font-size: 13px; font-weight: 500; opacity: .85; padding: 0 10px; font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #end { position: fixed; inset: 0; box-sizing: border-box; padding: 0 16px; display: none; place-items: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.3), rgba(0,0,0,.7)); z-index: 8; text-align: center; }
  #end h1 { margin: 0; font-weight: 300; text-transform: uppercase; font-size: clamp(1.8rem, 6vw, 4.5rem); letter-spacing: .3em; padding-left: .3em; text-shadow: 0 0 34px rgba(255,255,255,.28); }
  #end.show h1 { animation: titleIn 3s ease .6s both; }
  #end .line { height: 1px; width: 0; margin: 26px auto 0; background: linear-gradient(90deg, transparent, #fff, transparent); }
  #end.show .line { animation: lineGrow 2.4s ease 1.6s both; }
  @keyframes titleIn { from { opacity: 0; letter-spacing: .75em; transform: scale(.96); filter: blur(8px); } to { opacity: 1; letter-spacing: .3em; transform: none; filter: none; } }
  @keyframes lineGrow { to { width: min(70vw, 560px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes endIn { from { opacity: 0; } to { opacity: 1; } }
  #end.show { display: grid; animation: endIn 1.2s ease both; }
  #end .names { margin-top: 24px; display: flex; flex-direction: column; gap: .7em; font-weight: 300; text-transform: uppercase;
                letter-spacing: .22em; padding-left: .22em; font-size: clamp(.8rem, 2.2vw, 1.3rem); opacity: 0; }
  #end.show .names { animation: fadeUp 1.8s ease 2.6s both; }
  /* Intro: cassette, reproductor y zoom a la pantalla */
  #intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden;
           background: radial-gradient(ellipse 70% 55% at 50% 36%, #4b3827 0%, #2a1e14 45%, #120d09 75%, #060403 100%); transition: opacity 1s ease; }
  /* Luz de lámpara sobre la mesa y bruma suave */
  #intro::before { content: ""; position: absolute; inset: 0; pointer-events: none;
           background: radial-gradient(ellipse 40% 26% at 50% 78%, rgba(255,196,120,.10), transparent 70%),
                       linear-gradient(180deg, transparent 62%, rgba(0,0,0,.35) 100%); }
  #intro.out { opacity: 0; pointer-events: none; }
  /* Mesa con objetos de la época (1955–1983) detrás del reproductor */
  #desk { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; transition: opacity 1.6s ease, filter 1.6s ease; }
  #intro::before { z-index: 1; }
  #scene { position: relative; z-index: 2; }
  #intro.zooming #desk { opacity: 0; filter: blur(6px); }
  #scene { width: min(80vw, 96vh); width: min(80vw, 96dvh); height: auto; aspect-ratio: 1000 / 800; display: block; touch-action: none; user-select: none; }
  /* Celular en vertical: se muestra solo el centro del reproductor (placa + cassette), bien grande */
  /* Celular en vertical: la escena ocupa toda la pantalla y muestra la mesa con los objetos arriba y abajo */
  #scene.portrait { width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; }
  #scene:not(.portrait) #deskP { display: none; }
  #intro.portrait #desk { opacity: 0; }
  #cassette { cursor: grab; }
  #cassette.grab { cursor: grabbing; }
  #bay { transition: stroke .2s; }
  #bay.hot { stroke: #ffb44a; stroke-width: 5; filter: drop-shadow(0 0 10px rgba(255,170,70,.55)); }
  /* Al reproducir: parlantes que laten y agujas de los vúmetros que se mueven */
  .spin .cone { animation: thump .48s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes thump { 50% { transform: scale(1.03); } }
  .spin #vuL { animation: vuL 1.3s ease-in-out infinite; }
  .spin #vuR { animation: vuR 1.1s ease-in-out infinite; }
  @keyframes vuL { 0%,100% { transform: rotate(-22deg); } 15% { transform: rotate(10deg); } 32% { transform: rotate(-6deg); } 48% { transform: rotate(24deg); } 64% { transform: rotate(2deg); } 80% { transform: rotate(31deg); } }
  @keyframes vuR { 0%,100% { transform: rotate(-16deg); } 18% { transform: rotate(18deg); } 36% { transform: rotate(-2deg); } 55% { transform: rotate(28deg); } 72% { transform: rotate(-10deg); } 88% { transform: rotate(20deg); } }
  .needle { transition: transform .8s cubic-bezier(.3,1.4,.5,1); }
  .spin .reel { animation: reelSpin 1.4s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes reelSpin { to { transform: rotate(360deg); } }
  #hint { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 3;
          width: max-content; max-width: calc(100vw - 170px); box-sizing: border-box; text-align: center; color: #f1e6d2;
          font: 500 clamp(13px, 1.7vw, 17px)/1.35 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .01em;
          padding: 10px 20px; border-radius: 999px; background: rgba(22,15,10,.55); border: 1px solid rgba(241,230,210,.18);
          -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,.35);
          pointer-events: none; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .62; } }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  #playBtn { transition: transform .12s; }
  #skip { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 3;
          background: rgba(22,15,10,.45); border: 1px solid rgba(241,230,210,.22); color: rgba(241,230,210,.8); border-radius: 999px;
          padding: 9px 16px; font: 500 14px/1 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer;
          -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: background .2s, color .2s, border-color .2s; }
  #skip:hover { background: rgba(241,230,210,.14); color: #fff; border-color: rgba(241,230,210,.4); }
  #skip:focus-visible, #controls button:focus-visible { outline: 2px solid #ffb44a; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    #hint, .spin .cone, .spin #vuL, .spin #vuR, .blink, #leak.on, #vignette.beat { animation: none !important; }
  }

  /* ===== Celular ===== */
  @media (pointer: coarse) {
    #seekFill::after { transform: scale(1); }
    #skip { min-height: 44px; }
    #seek { height: 40px; }
    #seekTrack { height: 6px; }
  }
  @media (max-width: 700px) {
    /* menos desenfoque: el celular se traba con radios grandes */
    #stage.blur { filter: blur(14px) brightness(.5); }
    .bg, .vamb { filter: blur(26px) brightness(.42) saturate(1.2); }
    #end h1 { font-size: clamp(1.3rem, 7vw, 2rem); }
    /* transiciones más livianas para el celular */
    @keyframes tOut { to { transform: scale(1.04); filter: brightness(.7); } }
    @keyframes tZoom { from { opacity: 0; transform: scale(1.14); } 55% { opacity: 1; } to { opacity: 1; transform: none; } }
    @keyframes tDissolve { from { opacity: 0; } to { opacity: 1; } }
  }
  @media (max-width: 600px) {
    #controls { padding-left: calc(12px + env(safe-area-inset-left, 0px)); padding-right: calc(12px + env(safe-area-inset-right, 0px)); }
    #time { font-size: 12px; padding: 0 4px; }
    .slot::after { box-shadow: inset 0 0 60px rgba(0,0,0,.45); }
  }
  /* Celular en vertical: la intro deja lugar arriba (saltar) y abajo (pista) */
  @media (max-aspect-ratio: 17/20) {
    #intro { padding: 0; }
    #skip { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; }
    #hint { max-width: calc(100vw - 32px); }
  }
  @media (max-height: 500px) {
    /* celular acostado: el reproductor un poco más grande */
    #scene:not(.portrait) { width: min(90vw, 112vh); width: min(90vw, 112dvh); }
    /* la pista y "Saltar intro" pasan arriba para no tapar el cassette */
    #intro:not(.portrait) #hint { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; padding: 7px 16px; }
    #intro:not(.portrait) #skip { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; }
    #controls { padding-top: 18px; gap: 0; }
    #end h1 { font-size: clamp(1.2rem, 5vw, 2rem); }
    #end .line { margin-top: 14px; }
    #end .names { margin-top: 10px; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: .4em 1.6em; font-size: .75rem; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="slot" id="sa"><div class="bg"></div><img class="layer" id="a" alt="" decoding="async"></div>
  <div class="slot" id="sb"><div class="bg"></div><img class="layer" id="b" alt="" decoding="async"></div>
  <div class="slot" id="sv"><canvas class="vamb" id="vamb" width="48" height="27"></canvas><video class="layer" id="v" muted playsinline></video></div>
</div>
<div id="leak"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="flash"></div>
<div id="bar"></div>
<div id="warn"></div>

<div id="controls">
  <div id="seek"><div id="seekTrack"><div id="seekFill"></div></div></div>
  <div class="row">
    <button id="back" aria-label="Retroceder 10 segundos" title="Retroceder 10 s (←)"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.6" font-weight="700" font-family="system-ui,sans-serif">10</text></svg></button>
    <button id="pp" aria-label="Pausa" title="Pausa (espacio)"></button>
    <button id="fwd" aria-label="Adelantar 10 segundos" title="Adelantar 10 s (→)"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.6" font-weight="700" font-family="system-ui,sans-serif">10</text></svg></button>
    <span id="time">0:00 / 0:00</span>
    <span class="grow"></span>
    <button id="mute" aria-label="Silenciar" title="Sonido (M)"></button>
    <button id="fs" aria-label="Pantalla completa" title="Pantalla completa (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM6 15v3h3v2H4v-5h2zm12 0h2v5h-5v-2h3v-3z"/></svg></button>
  </div>
</div>

<div id="intro">
  <svg id="desk" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="dWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17110c"/><stop offset=".7" stop-color="#2e2219"/><stop offset="1" stop-color="#3a2b1f"/></linearGradient>
    <pattern id="dPaperWall" width="46" height="46" patternUnits="userSpaceOnUse"><rect width="46" height="46" fill="none"/><path d="M23 6 l5 9 -5 9 -5 -9 z" fill="#d8b48a" opacity=".05"/><rect x="0" y="0" width="1.5" height="46" fill="#000" opacity=".12"/></pattern>

const V1_NAME = "22,5.mp4", V1_AT = 93;                // primer video: 1:33
const V2_NAME = "segundovideo.mp4", V2_AT = 171;       // segundo video: 2:51
const DUCK_V2 = 0.15;                                  // volumen de la música durante el segundo video
const MONTAGE_S = 11;                                  // montaje final acelerado
const BURST = Array.from({ length: 41 }, (_, k) => "rafaga " + (k + 1) + ".png");   // las que no existan se saltean
const AFTER_MAX = 30;                                  // despuesdelsegundovideo1..30 (las que no existan se saltean)

// ---------- Carga de archivos ----------
// Si un nombre exacto no existe, prueba variantes (.jpg, .png, .jpeg, ..jpg)
// ---------- Música ----------
// En GitHub Pages (y cualquier servidor) los nombres distinguen mayúsculas, minúsculas y tildes:
// "Musica.mp3" no es lo mismo que "musica.mp3". Windows no las distingue, por eso en la compu andaba.
const MUSIC_NAMES = [];
["musica", "Musica", "MUSICA", "música", "Música", "MÚSICA", "music", "Music", "cancion", "canción"].forEach(b =>
  ["mp3", "MP3", "Mp3", "m4a", "M4A", "wav", "WAV", "ogg", "aac"].forEach(e => MUSIC_NAMES.push(b + "." + e)));
const onServer = /^https?:$/.test(location.protocol);

// ¿Existe el archivo? En un servidor se pregunta sin descargarlo; en la compu se prueba con el reproductor
async function exists(url) {
  if (onServer) {
    try {
      const r = await fetch(url, { method: "HEAD", cache: "no-store" });
      if (r.ok) {
        // un archivo de Git LFS llega como un texto chiquito en lugar del audio
        const len = +(r.headers.get("content-length") || 0);
        if (len > 0 && len < 2000) return "lfs";
        return true;
      }
      if (r.status !== 405) return false;
    } catch (e) {}
  }
  return new Promise(res => {
    const a = new Audio();
    const done = v => { a.removeAttribute("src"); res(v); };
    a.preload = "metadata";
    a.onloadedmetadata = () => done(true);
    a.onerror = () => done(false);
    a.src = url;
    setTimeout(() => done(false), 6000);
  });
}
let musicName = null, lfsFound = false;
async function findMusic() {
  for (const n of MUSIC_NAMES) {
    const ok = await exists(encodeURIComponent(n));
    if (ok === "lfs") { lfsFound = true; continue; }
    if (ok) { musicName = n; return true; }
  }
  return false;
}
function waitDuration(ms) {
  if (isFinite(music.duration) && music.duration > 0) return Promise.resolve(true);
  return new Promise(r => {
    const t = setTimeout(() => r(false), ms);
    music.addEventListener("loadedmetadata", () => { clearTimeout(t); r(isFinite(music.duration) && music.duration > 0); }, { once: true });
  });
}
let durGuess = false;   // true si todavía no se sabe cuánto dura la canción (pasa en iPhone hasta el primer toque)

function candidates(name) {
  if (/\.mp4$/i.test(name)) {
    const b = name.replace(/\.mp4$/i, "");
    const cap = b.charAt(0).toUpperCase() + b.slice(1);
    return [...new Set([name, b + ".MP4", b.toLowerCase() + ".mp4", cap + ".mp4", b + ".mov", b + ".MOV", b + ".webm"])];
  }
  const m = name.match(/^(\d+(?:,\d+)?)/);
  const base = m ? m[1] : name;
  const list = [name, base + ".jpg", base + ".png", base + ".jpeg", base + "..jpg", base + ".JPG", base + ".PNG", base + "jpg"];
  return [...new Set(list)];
}

function tryLoad(url) {
  return new Promise(res => {
    if (/\.mp4$/i.test(decodeURIComponent(url))) {
      const v = document.createElement("video");
      v.preload = "metadata";
      v.onloadedmetadata = () => res(true);
      v.onerror = () => res(false);
      v.src = url;
      return;
    }
    const im = new Image();
    im.onload = () => res(true);
    im.onerror = () => res(false);
    im.src = url;
  });
}

function videoDuration(url) {
  return new Promise(res => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.onloadedmetadata = () => res(isFinite(v.duration) && v.duration > 0 ? v.duration : null);
    v.onerror = () => res(null);
    v.src = url;
    setTimeout(() => res(null), 4000);
  });
}

const cache = new Map();
function resolve(i) {
  if (cache.has(i)) return cache.get(i);
  const p = (async () => {
    for (const c of candidates(FILES[i])) {
      const url = encodeURIComponent(c);
      if (await tryLoad(url)) return url;
    }
    return null;
  })();
  cache.set(i, p);
  return p;
}

let burstP = null, afterP = null;
function loadBurst() {
  if (!burstP) {
    burstP = Promise.all(BURST.map(async n => {
      for (const c of [n, n.replace(/\.png$/, ".jpg")]) {
        const u = encodeURIComponent(c);
        if (await tryLoad(u)) return u;
      }
      return null;
    })).then(a => a.filter(Boolean));
  }
  return burstP;
}
function loadAfter() {
  if (!afterP) {
    afterP = Promise.all(Array.from({ length: AFTER_MAX }, async (_, k) => {
      const n = k + 1;
      const names = [
        "despuesdelsegundovideo" + n + ".png",
        "despuesdelsegundo video" + n + ".png",
        "despuesdelsegundo_video" + n + ".png",
        "despuesdelsegundovideo" + n + ".jpg"
      ];
      for (const c of names) {
        const u = encodeURIComponent(c);
        if (await tryLoad(u)) return u;
      }
      return null;
    })).then(a => a.filter(Boolean));
  }
  return afterP;
}

// ---------- Elementos ----------
const $ = id => document.getElementById(id);
const layers = [$("a"), $("b")];
const slots = [$("sa"), $("sb"), $("sv")];
const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const vid = $("v");
const music = $("music");
const stage = $("stage");

// Pone una foto en su placa, con la copia desenfocada detrás
function setSrc(img, url, keepBg) {
  if (!url || img.dataset.url === url) return;
  img.dataset.url = url;
  img.src = url;
  // en los cortes muy rápidos el fondo no se recalcula en cada foto (así no se traba)
  if (!keepBg) img.previousElementSibling.style.backgroundImage = 'url("' + url + '")';
}

// Precarga y decodifica las fotos que vienen, para que nunca aparezcan a medio cargar
const decoded = new Map();
function preload(url) {
  if (!url || decoded.has(url)) return;
  const im = new Image();
  im.decoding = "async";
  im.src = url;
  if (im.decode) im.decode().catch(() => {});
  decoded.set(url, im);
  if (decoded.size > 28) decoded.delete(decoded.keys().next().value);
}
function preloadAhead(seg) {
  const horizon = seg.start + 4;
  for (let i = seg.id + 1, n = 0; i < segs.length && segs[i].start < horizon && n < 30; i++, n++) {
    if (segs[i].type !== "video") preload(segs[i].url);
  }
}

// Iconos de los controles
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>',
  vol: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  muted: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.3 3 2.4-2.4-1.3-1.3-2.4 2.4-2.4-2.4-1.3 1.3 2.4 2.4-2.4 2.4 1.3 1.3 2.4-2.4 2.4 2.4 1.3-1.3z" transform="translate(2 0)"/></svg>'
};
$("pp").innerHTML = ICON.pause;
$("mute").innerHTML = ICON.vol;

// Golpe de cada foto de la ráfaga: zoom con giro alternado, fogonazo de luz y, cada dos cortes, un destello suave
function punch(el, k, quiet, montage) {
  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = montage ? "montPop .22s ease-out both"
                               : (k % 2 ? "burstPopA" : "burstPopB") + " .32s cubic-bezier(.2,.8,.2,1) both";
  if (quiet || RM) return;   // en el montaje muy rápido no hay destello (evita el parpadeo)
  const vg = $("vignette");
  vg.classList.remove("beat"); void vg.offsetWidth; vg.classList.add("beat");
  if (k % 2) return;         // destello solo cada dos cortes: más ritmo y menos parpadeo
  const f = $("flash");
  if (f.classList.contains("big")) return;   // el destello grande tiene prioridad
  f.classList.remove("on");
  void f.offsetWidth;
  f.classList.add("on");
}
// Luz de película que cruza la pantalla
function lightLeak() {
  if (RM) return;
  const l = $("leak");
  l.classList.remove("on"); void l.offsetWidth; l.classList.add("on");
}
// Destello blanco grande
function bigFlash() {
  const f = $("flash");
  f.classList.remove("on", "big");
  void f.offsetWidth;
  f.classList.add("big");
}
$("flash").addEventListener("animationend", () => $("flash").classList.remove("on", "big"));

// ---------- Línea de tiempo ----------
// Todo lo que se ve depende solo del tiempo de la música: así se puede adelantar y
// retroceder sin que las fotos ni los videos se desfasen.
let segs = [], D = 240, ready = false;
const ambCtx = $("vamb").getContext("2d");

async function buildTimeline() {
  if (!music.getAttribute("src")) {
    if (!(await findMusic())) {
      const err = new Error("sin música");
      err.music = true;
      throw err;
    }
    music.src = encodeURIComponent(musicName);
    music.load();
  }
  await waitDuration(onServer ? 10000 : 4000);
  durGuess = !(isFinite(music.duration) && music.duration > 0);
  D = durGuess ? 240 : music.duration;

  await Promise.all(FILES.map((_, i) => resolve(i)));
  const burstUrls = await loadBurst();
  const afterList = await loadAfter();

  const i1 = FILES.indexOf(V1_NAME), i2 = FILES.indexOf(V2_NAME);
  const before = [], later = [], all = [];
  for (let i = 0; i < FILES.length; i++) {
    if (/\.mp4$/i.test(FILES[i])) continue;
    const u = await resolve(i);
    if (!u) continue;
    all.push(u);
    (i < i1 ? before : later).push(u);
  }
  const v1u = await resolve(i1), v2u = await resolve(i2);
  const d1 = v1u ? await videoDuration(v1u) : null;
  const d2 = v2u ? await videoDuration(v2u) : null;
  const v1 = (v1u && d1) ? { url: v1u, dur: d1 } : null;
  const v2 = (v2u && d2) ? { url: v2u, dur: d2 } : null;

  const out = [];
  let flagAfterBurst = false;
  const photo = (url, s, e) => {
    const seg = { type: "photo", url, start: s, end: e };
    if (flagAfterBurst) { seg.afterBurst = true; flagAfterBurst = false; }
    out.push(seg);
  };
  const holdLast = until => {
    const l = out[out.length - 1];
    if (l && l.type === "photo" && l.end < until) l.end = until;
  };

  // 1) Fotos hasta el primer video, con la ráfaga en 0:53–1:05
  const burstLen = BURST_END - BURST_AT;
  let burstDone = !burstUrls.length;
  const addBurst = () => {
    const step = burstLen / burstUrls.length;
    burstUrls.forEach((u, k) => out.push({
      type: "burst", url: u, k, start: BURST_AT + k * step, end: BURST_AT + (k + 1) * step, first: k === 0
    }));
    burstDone = true;
    flagAfterBurst = true;
  };
  let t = 0;
  const N = before.length;
  let per = (V1_AT - (burstDone ? 0 : burstLen)) / Math.max(1, N);
  for (let j = 0; j < N; j++) {
    if (!burstDone && t >= BURST_AT - 1e-6) { addBurst(); t = BURST_END; per = (V1_AT - t) / (N - j); }
    const s = t;
    let e = t + per;
    if (!burstDone && e > BURST_AT) e = BURST_AT;
    photo(before[j], s, e);
    t = e;
  }
  if (!burstDone) {
    addBurst(); t = BURST_END;
    if (N) photo(before[N - 1], t, V1_AT);
  }
  holdLast(V1_AT);

  // 2) Primer video en 1:33
  t = V1_AT;
  if (v1) { out.push({ type: "video", url: v1.url, start: V1_AT, end: V1_AT + v1.dur }); t = V1_AT + v1.dur; }
  const v2At = Math.max(V2_AT, t);

  // 3) Fotos hasta el segundo video
  let jR = 0;
  while (jR < later.length && t < v2At - 1e-6) {
    const e = Math.min(t + SLIDE_S, v2At);
    photo(later[jR], t, e); t = e; jR++;
  }
  holdLast(v2At);

  // 4) Segundo video en 2:51 (la música baja)
  t = v2At;
  if (v2) { out.push({ type: "video", url: v2.url, start: v2At, end: v2At + v2.dur, duck: true }); t = v2At + v2.dur; }

  // 5) Todas las fotos de "despuesdelsegundovideo": si falta tiempo, pasan más rápido (mínimo 0,45 s)
  const F = D - (MONTAGE_S + 0.7 + 4.5);              // hora en que debería arrancar el final
  if (afterList.length) {
    const per2 = Math.min(SLIDE_S, Math.max(0.45, (F - t - 0.5) / afterList.length));
    afterList.forEach(u => { photo(u, t, t + per2); t += per2; });
  }
  const Fe = Math.max(F, t);

  // 6) Fotos normales que quedan, hasta el final
  while (jR < later.length && t < Fe - 1e-6) {
    const e = Math.min(t + SLIDE_S, Fe);
    photo(later[jR], t, e); t = e; jR++;
  }
  holdLast(Fe);

  // 7) Montaje final: cada vez más rápido, repitiendo fotos si hace falta.
  //    No se detiene: sigue a ritmo rápido mientras aparece el título y el fondo se nubla.
  const Ms = Math.max(3, Math.min(MONTAGE_S, D - Fe - 5.2));
  const pool = [...all, ...burstUrls, ...afterList];
  const dMin = 0.06;                                   // ritmo final: una foto cada 0,06 s
  const total = Math.max(Ms + 1, D + 1 - Fe);
  let k = 0, tm = 0;
  while (tm < total) {
    const d = tm < Ms ? 0.45 * Math.pow(dMin / 0.45, tm / Ms) : dMin;
    out.push({
      type: "montage", url: pool.length ? pool[k % pool.length] : null, k,
      start: Fe + tm, end: Fe + tm + d, p: Math.min(1, tm / Ms),
      title: tm >= Ms - 1e-6   // title: ya se ve el título con el fondo nublado
    });
    tm += d; k++;
  }

  out.sort((x, y) => x.start - y.start);
  out.forEach((s, idx) => { s.id = idx; });
  segs = out;
}

function findSeg(t) {
  let lo = 0, hi = segs.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (segs[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return segs[ans];
}

// ---------- Dibujar ----------
let curSeg = null, frontSlot = null, lastT = -999, playing = false, active = false, seekT = null, ambN = 0;

// Pone una placa al frente con una transición; la anterior queda debajo hasta que termina
function setFront(slot, anim, td) {
  const prev = frontSlot;
  slots.forEach(s => {
    if (s === slot || s === prev) return;
    clearTimeout(s._t); s.className = "slot"; s.style.animation = "";
  });
  clearTimeout(slot._t);
  slot.className = "slot front";
  slot.style.animation = "none";
  void slot.offsetWidth;
  slot.style.animation = anim ? anim + " " + td + "s cubic-bezier(.45,0,.15,1) both" : "";
  if (prev && prev !== slot) {
    clearTimeout(prev._t);
    if (anim) {
      prev.className = "slot back";
      prev.style.animation = "tOut " + td + "s ease-in both";
      prev._t = setTimeout(() => { if (frontSlot !== prev) { prev.className = "slot"; prev.style.animation = ""; } }, td * 1000 + 80);
    } else { prev.className = "slot"; prev.style.animation = ""; }
  }
  frontSlot = slot;
}
function hideAll() {
  slots.forEach(s => { clearTimeout(s._t); s.className = "slot"; s.style.animation = ""; s.style.transform = ""; });
  frontSlot = null;
}

// Elige la transición de cada foto: variadas en los pasajes lentos, simples cuando las fotos pasan rápido
const TRANS = ["tDissolve", "tZoom", "tWipeL", "tDissolve", "tRise", "leak", "tIris", "tDissolve", "tWipeR", "tZoom"];
function pickTrans(seg, prev, jump) {
  const len = seg.end - seg.start;
  if (jump) return ["tDissolve", 0.25];
  if (!prev) return ["tDissolve", 2.2];
  if (prev.type === "video") return ["tDissolve", 1.1];
  if (prev.type === "burst") return ["tZoom", 0.9];
  if (len < 1.4) return ["tDissolve", Math.max(0.15, len * 0.4)];
  return [TRANS[seg.id % TRANS.length], Math.min(1.4, len * 0.4)];
}
// Recorrido del zoom lento: cada foto acerca o aleja, con un desplazamiento distinto
function kbVars(img, id) {
  const r = n => { const x = Math.sin(id * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };
  const zoomIn = id % 3 !== 1;
  const a = 1 + r(1) * 0.03, b = 1.1 + r(2) * 0.06;
  img.style.setProperty("--s0", zoomIn ? a : b);
  img.style.setProperty("--s1", zoomIn ? b : a);
  img.style.setProperty("--x0", ((r(3) - 0.5) * 3).toFixed(2) + "%");
  img.style.setProperty("--y0", ((r(4) - 0.5) * 2).toFixed(2) + "%");
  img.style.setProperty("--x1", ((r(5) - 0.5) * 3).toFixed(2) + "%");
  img.style.setProperty("--y1", ((r(6) - 0.5) * 2).toFixed(2) + "%");
}
function unblur() {
  stage.style.transition = "none";
  stage.classList.remove("blur");
  void stage.offsetWidth;
  stage.style.transition = "";
}

function checkVideoAudio() {
  if (!curSeg || curSeg.type !== "video") return;
  let msg = "";
  if (vid.muted && !music.muted) {
    msg = "El navegador bloqueó el sonido del video. Tocá la pantalla para activarlo.";
  } else if (vid.mozHasAudio === false ||
             (typeof vid.webkitAudioDecodedByteCount === "number" && !vid.paused &&
              vid.currentTime > 1 && vid.webkitAudioDecodedByteCount === 0)) {
    msg = "Este video no tiene audio o el navegador no puede reproducirlo.";
  }
  const w = $("warn");
  w.textContent = msg;
  w.style.display = msg ? "block" : "none";
}

function applySeg(seg, t, jump) {
  const prev = curSeg;
  curSeg = seg;
  $("warn").style.display = "none";
  if (jump) {
    stage.classList.add("seek");
    clearTimeout(seekT);
    seekT = setTimeout(() => stage.classList.remove("seek"), 450);
  }
  const isFrame = seg.type === "burst" || seg.type === "montage";
  stage.classList.toggle("burst", isFrame);
  if (!seg.title) {
    if (stage.classList.contains("blur")) unblur();
    $("end").classList.remove("show");
  }
  if (prev && prev.type === "video" && seg.type !== "video") {
    setTimeout(() => { if (!curSeg || curSeg.type !== "video") vid.pause(); }, 700);
  }

  preloadAhead(seg);

  if (seg.type === "photo") {
    const slot = (frontSlot === slots[0]) ? slots[1] : slots[0];
    const el = slot.querySelector("img");
    const [trans, td] = pickTrans(seg, prev, jump);
    slot.style.transform = "";
    setSrc(el, seg.url);
    const go = () => {
      if (curSeg !== seg) return;
      const now = Math.min(D, music.currentTime);
      const dur = Math.max(2, seg.end - seg.start) + td + 1;
      kbVars(el, seg.id);
      el.style.animation = "none";
      void el.offsetWidth;
      // el zoom arranca en el punto que corresponde al tiempo actual (así también sirve al adelantar o retroceder)
      el.style.animation = "kb " + dur + "s cubic-bezier(.3,.15,.55,1) " + (-(now - seg.start + td * 0.3)) + "s forwards";
      if (trans === "leak") { setFront(slot, "tDissolve", td); lightLeak(); }
      else setFront(slot, trans, td);
      if (seg.afterBurst && prev && prev.type === "burst" && !jump) bigFlash();   // destello al cerrar la ráfaga
    };
    // espera a que la foto esté decodificada (como mucho 300 ms) para que no aparezca a medias
    if (el.complete && el.naturalWidth) go();
    else {
      let done = false;
      const fin = () => { if (!done) { done = true; go(); } };
      if (el.decode) el.decode().then(fin, fin); else el.onload = fin;
      setTimeout(fin, 300);
    }
  } else if (seg.type === "video") {
    if (vid.dataset.url !== seg.url) { vid.src = seg.url; vid.dataset.url = seg.url; }
    vid.muted = music.muted;
    vid.volume = 1;
    try { vid.currentTime = Math.max(0, t - seg.start); } catch (e) {}
    if (playing) vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
    setFront(slots[2], "tZoom", jump ? 0.25 : 1.1);
    setTimeout(checkVideoAudio, 1800);
  } else if (isFrame) {
    const a = layers[0];
    setSrc(a, seg.url, seg.type === "montage" && (seg.end - seg.start) < 0.25);
    setFront(slots[0], null, 0);
    // en el montaje la imagen se va acercando cada vez más, como un túnel
    slots[0].style.transform = seg.type === "montage" ? "scale(" + (1 + 0.14 * seg.p).toFixed(3) + ")" : "";
    const quiet = seg.title || (seg.end - seg.start) < 0.12;
    if (seg.first && !jump) bigFlash(); else punch(a, seg.k, quiet, seg.type === "montage");   // destello al abrir la ráfaga
    if (seg.title) {
      // aparece el título y el fondo se va nublando mientras las fotos siguen cambiando
      stage.classList.add("blur");
      $("end").classList.add("show");
      if (prev && !prev.title && !jump) bigFlash();
    }
  }
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function tick() {
  if (!active || !segs.length) return;
  const t = Math.min(D, music.currentTime);
  const seg = findSeg(t);
  const jump = Math.abs(t - lastT) > 0.8;
  if (seg !== curSeg) applySeg(seg, t, jump);
  lastT = t;

  // El video se mantiene alineado con la música
  if (curSeg && curSeg.type === "video") {
    const want = t - curSeg.start;
    if (Math.abs(vid.currentTime - want) > 0.6) { try { vid.currentTime = want; } catch (e) {} }
    if (playing) { if (vid.paused && want < (vid.duration || Infinity) - 0.05) vid.play().catch(() => {}); }
    else if (!vid.paused) vid.pause();
    // copia desenfocada del video en los costados (dibujada en miniatura, casi no consume)
    if (++ambN % 3 === 0 && vid.readyState >= 2) { try { ambCtx.drawImage(vid, 0, 0, 48, 27); } catch (e) {} }
  }

  // Volumen de la música: baja durante el segundo video y se apaga suave al final
  let target = (curSeg && curSeg.duck) ? DUCK_V2 : 1;
  const rem = D - t;
  if (rem < 3) target *= Math.max(0, rem / 3);
  music.volume = Math.max(0, Math.min(1, music.volume + (target - music.volume) * 0.25));

  const pct = (t / D * 100) + "%";
  $("seekFill").style.width = pct;
  $("bar").style.width = pct;
  $("time").textContent = fmt(t) + " / " + fmt(D);
}
setInterval(tick, 30);

// ---------- Control de reproducción ----------
function seekTo(t) {
  t = Math.max(0, Math.min(D - 0.05, t));
  music.currentTime = t;
  if (playing && music.paused) music.play().catch(() => {});
  lastT = -999;   // fuerza un cambio rápido de foto
  tick();
}
function setPP(isPlaying) {
  $("pp").innerHTML = isPlaying ? ICON.pause : ICON.play;
  $("pp").setAttribute("aria-label", isPlaying ? "Pausa" : "Reanudar");
}
function pause() {
  playing = false;
  music.pause();
  vid.pause();
  stage.classList.add("paused");
  setPP(false);
  document.body.classList.remove("idle");   // en pausa los controles quedan a la vista
}
function resume() {
  if (music.ended || music.currentTime >= D - 0.1) { seekTo(0); }
  playing = true;
  stage.classList.remove("paused");
  music.play().catch(() => {});
  if (curSeg && curSeg.type === "video") vid.play().catch(() => {});
  setPP(true);
  wake();
}
function begin() {
  $("intro").classList.add("out");
  $("end").classList.remove("show");
  document.body.classList.add("active");
  unblur();
  stage.classList.remove("paused", "burst");
  hideAll();
  curSeg = null; lastT = -999;
  playing = true; active = true;
  music.volume = 1;
  music.currentTime = 0;
  music.play().catch(() => {});
  setPP(true);
  wake();
  tick();
}

$("pp").onclick = () => playing ? pause() : resume();
$("back").onclick = () => seekTo(music.currentTime - 10);
$("fwd").onclick = () => seekTo(music.currentTime + 10);
$("mute").onclick = () => { music.muted = !music.muted; vid.muted = music.muted; $("mute").innerHTML = music.muted ? ICON.muted : ICON.vol; $("mute").setAttribute("aria-label", music.muted ? "Activar sonido" : "Silenciar"); };
const rootEl = document.documentElement;
const canFS = !!(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen);
if (!canFS) $("fs").style.display = "none";
$("fs").onclick = () => {
  const inFS = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    const r = inFS
      ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      : (rootEl.requestFullscreen || rootEl.webkitRequestFullscreen).call(rootEl);
    if (r && r.catch) r.catch(() => {});
  } catch (e) {}
};

// Barra para adelantar / retroceder (clic o arrastrar)
const seekEl = $("seek");
let dragging = false;
function seekFromEvent(e) {
  const r = seekEl.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  seekTo(x * D);
}
seekEl.addEventListener("pointerdown", e => { dragging = true; seekEl.setPointerCapture(e.pointerId); seekFromEvent(e); });
seekEl.addEventListener("pointermove", e => { if (dragging) seekFromEvent(e); });
seekEl.addEventListener("pointerup", () => { dragging = false; });
seekEl.addEventListener("pointercancel", () => { dragging = false; });

// Un clic en la pantalla activa el sonido del video si el navegador lo bloqueó; si no, pausa o reanuda
stage.addEventListener("click", () => {
  if (curSeg && curSeg.type === "video" && vid.muted && !music.muted) {
    vid.muted = false;
    vid.play().catch(() => {});
    $("warn").style.display = "none";
  } else if (active && curSeg && !curSeg.title) {
    if (isTouch && document.body.classList.contains("idle")) { wake(); return; }
    $("pp").click();
  }
});

document.addEventListener("keydown", e => {
  if (!active) { if ((e.key === "Enter" || e.key === " ") && !introBusy) { e.preventDefault(); insertSequence(); } return; }
  if (e.key === " ") { e.preventDefault(); $("pp").click(); }
  if (e.key === "ArrowRight") seekTo(music.currentTime + 5);
  if (e.key === "ArrowLeft") seekTo(music.currentTime - 5);
  if (e.key === "f" || e.key === "F") $("fs").click();
  if (e.key === "m" || e.key === "M") $("mute").click();
});

// Oculta controles tras unos segundos sin mover el mouse (en celular, sin tocar la pantalla)
const isTouch = window.matchMedia("(pointer: coarse)").matches;
let idleT;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, isTouch ? 3500 : 3000);
}
document.addEventListener("pointermove", e => { if (e.pointerType === "mouse") wake(); });
$("controls").addEventListener("pointerdown", wake);

// ---------- Intro: se pone el cassette en el reproductor, zoom a la pantalla y empieza ----------
let introBusy = false, loadFailed = false, audioUnlocked = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const scene = $("scene"), cassette = $("cassette");
const HOME = { x: 500, y: 680, r: -4, s: 1 };       // dónde está el cassette al principio
const BAY = { x: 500, y: 380 };                     // centro del compartimento del reproductor
let cass = { ...HOME };

// En celular vertical se recorta el SVG al centro del reproductor para que se vea grande
function fitScene() {
  if (introBusy) return;
  const portrait = window.innerWidth / window.innerHeight < 0.85;
  scene.classList.toggle("portrait", portrait);
  $("intro").classList.toggle("portrait", portrait);
  if (!portrait) { scene.setAttribute("viewBox", "0 0 1000 800"); return; }
  // ancho visible: el centro del reproductor en celulares, un poco más en tablets
  const r = scene.getBoundingClientRect();
  const ratio = r.width / r.height;
  const VW = Math.min(1000, Math.max(600, 600 + (ratio - 0.62) * 1700));
  const HU = VW / ratio;
  // el espacio que sobra se reparte: arriba la pared con cuadros, abajo la mesa con los recortes
  const extra = HU - 750;
  const top = 24 - Math.max(0, extra) * 0.42 - Math.min(0, extra) * 0.5;
  scene.setAttribute("viewBox", (500 - VW / 2).toFixed(1) + " " + top.toFixed(1) + " " + VW.toFixed(1) + " " + HU.toFixed(1));
}
if (window.matchMedia("(pointer: coarse)").matches) $("hint").textContent = "Arrastrá o tocá el cassette";
fitScene();
window.addEventListener("resize", fitScene);
window.addEventListener("orientationchange", fitScene);

function setCass(c) {
  cassette.setAttribute("transform", "translate(" + c.x + " " + c.y + ") rotate(" + c.r + ") scale(" + c.s + ")");
}
const easeInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function tween(to, ms) {
  const from = { ...cass };
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - t0) / ms), e = easeInOut(p);
      cass = {
        x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e,
        r: from.r + (to.r - from.r) * e, s: from.s + (to.s - from.s) * e
      };
      setCass(cass);
      if (p < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
function svgPoint(e) {
  const pt = scene.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(scene.getScreenCTM().inverse());
}
// Contador de cinta de la pantalla
let counterT = null;
function startCounter() {
  let n = 0;
  clearInterval(counterT);
  counterT = setInterval(() => { n = (n + 1) % 1000; $("counter").textContent = String(n).padStart(3, "0"); }, 110);
}
function stopCounter() { clearInterval(counterT); $("counter").textContent = "000"; }
function screenText(t) {
  const el = $("screenText");
  el.textContent = t;
  el.classList.remove("blink");
}

// Sonidos simples hechos con el navegador (sin archivos extra)
let AC = null;
function actx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, delay) {
  const c = actx();
  if (!c || music.muted) return;
  const o = c.createOscillator(), g = c.createGain();
  const t = c.currentTime + (delay || 0);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, rise) {
  const c = actx();
  if (!c || music.muted) return;
  const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = c.createGain(); const t = c.currentTime;
  if (rise) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + rise);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
  } else {
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t);
}
const sfx = {
  slide: () => noise(.25, .12, 900),
  clack: () => { noise(.07, .35, 2500); tone(160, .09, "square", .12); },
  play: () => { noise(.06, .45, 1800); tone(95, .14, "square", .18); tone(260, .05, "square", .06, .02); },
  whir: () => noise(2.6, .12, 500, 1.2)
};

// Prepara la música en el primer toque (algunos navegadores lo exigen)
function unlockAudio() {
  actx();
  if (audioUnlocked) return;
  audioUnlocked = true;
  music.volume = 0;
  music.play().then(() => { music.pause(); music.currentTime = 0; }).catch(() => {}).finally(() => { music.volume = 1; });
}

// El zoom: la pantalla del reproductor crece hasta ocupar toda la ventana
function zoomToScreen() {
  return new Promise(res => {
    const sr = $("screenRect").getBoundingClientRect();
    const br = scene.getBoundingClientRect();
    const VW = window.innerWidth, VH = window.innerHeight;
    const s = Math.max(VW / sr.width, VH / sr.height) * 1.08;
    const cx = sr.left + sr.width / 2 - br.left, cy = sr.top + sr.height / 2 - br.top;
    const tx = VW / 2 - br.left - s * cx, ty = VH / 2 - br.top - s * cy;
    scene.style.transformOrigin = "0 0";
    scene.style.transition = "transform 2.6s cubic-bezier(.6,0,.2,1)";
    scene.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + s + ")";
    $("intro").classList.add("zooming");
    sfx.whir();
    const nz = $("noise");
    nz.style.transition = "opacity 2.2s ease .3s";
    nz.style.opacity = ".85";
    setTimeout(res, 2700);
  });
}

async function insertSequence() {
  if (introBusy) return;
  introBusy = true;
  unlockAudio();
  $("hint").style.display = "none";
  $("skip").style.display = "none";
  $("bay").classList.remove("hot");
  // 1) el cassette se acomoda sobre la ranura
  await tween({ x: BAY.x, y: BAY.y - 70, r: 0, s: 0.95 }, 380);
  // 2) entra en el compartimento, detrás del vidrio
  $("bayLayer").appendChild(cassette);
  cassette.style.cursor = "default";
  sfx.slide();
  await tween({ x: BAY.x, y: BAY.y, r: 0, s: 0.85 }, 420);
  sfx.clack();
  $("led2").setAttribute("fill", "#46ff7a");
  screenText("CASSETTE OK");
  // 3) si todavía se están cargando las fotos, espera
  if (!ready && !loadFailed) {
    screenText("CARGANDO…");
    while (!ready && !loadFailed) await sleep(150);
  }
  if (loadFailed) { screenText("ERROR"); $("hint").style.display = ""; return; }
  if (durGuess) { screenText("CARGANDO…"); await fixDuration(); }
  await sleep(500);
  // 4) se aprieta PLAY y giran los carretes
  $("playBtn").style.transform = "translateY(4px)";
  sfx.play();
  scene.classList.add("spin");
  startCounter();
  screenText("▶ PLAY");
  await sleep(1000);
  // 5) zoom a la pantalla y empieza
  await zoomToScreen();
  begin();
}

async function skipIntro() {
  if (introBusy) return;
  introBusy = true;
  unlockAudio();
  $("skip").style.display = "none";
  while (!ready && !loadFailed) await sleep(150);
  if (ready) { if (durGuess) await fixDuration(); begin(); }
}
async function fixDuration() {
  if (await waitDuration(8000)) { await buildTimeline(); }
}
$("skip").onclick = skipIntro;

// Arrastrar el cassette (o tocarlo) para ponerlo en el reproductor
let drag = null;
cassette.addEventListener("pointerdown", e => {
  if (introBusy) return;
  e.preventDefault();
  unlockAudio();
  const p = svgPoint(e);
  drag = { dx: cass.x - p.x, dy: cass.y - p.y, sx: e.clientX, sy: e.clientY, moved: false };
  cassette.setPointerCapture(e.pointerId);
  cassette.classList.add("grab");
  $("hint").style.display = "none";
});
cassette.addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
  const p = svgPoint(e);
  cass = { x: p.x + drag.dx, y: p.y + drag.dy, r: cass.r * 0.85, s: 1 };
  setCass(cass);
  $("bay").classList.toggle("hot", Math.hypot(cass.x - BAY.x, cass.y - BAY.y) < 190);
});
async function endDrag() {
  if (!drag) return;
  const d = drag;
  drag = null;
  cassette.classList.remove("grab");
  if (!d.moved) return insertSequence();   // un toque alcanza: se inserta solo
  if (Math.hypot(cass.x - BAY.x, cass.y - BAY.y) < 190) return insertSequence();
  $("bay").classList.remove("hot");
  await tween(HOME, 450);
  $("hint").style.display = "";
}
cassette.addEventListener("pointerup", endDrag);
cassette.addEventListener("pointercancel", endDrag);

// ---------- Final: se queda el título unos segundos y el cassette sale del reproductor ----------
function onEnded() {
  if (!active) return;
  active = false; playing = false;
  vid.pause();
  clearTimeout(idleT);
  document.body.classList.remove("active", "idle");
  setTimeout(eject, 7000);
}
music.addEventListener("ended", onEnded);

async function eject() {
  // la escena vuelve a como estaba antes de poner el cassette
  scene.style.transition = "none";
  scene.style.transform = "";
  void scene.offsetWidth;
  scene.classList.remove("spin");
  stopCounter();
  const nz = $("noise"); nz.style.transition = "none"; nz.style.opacity = "0";
  $("playBtn").style.transform = "";
  $("led2").setAttribute("fill", "#2a3a2c");
  const st = $("screenText"); st.textContent = "INSERTE CASSETTE"; st.classList.add("blink");
  $("bay").classList.remove("hot");
  // el cassette arranca dentro de la ranura
  $("topLayer").appendChild(cassette);
  cassette.style.cursor = "";
  cass = { x: BAY.x, y: BAY.y, r: 0, s: 0.85 };
  setCass(cass);
  $("intro").classList.remove("zooming");
  $("intro").classList.remove("out");
  await sleep(1100);
  $("end").classList.remove("show");
  // y sale: sube un poco y baja a su lugar
  sfx.slide();
  await tween({ x: BAY.x, y: BAY.y - 70, r: 0, s: 0.95 }, 420);
  sfx.clack();
  await tween(HOME, 650);
  drag = null;
  $("hint").style.display = "";
  $("skip").style.display = "";
  introBusy = false;
  fitScene();
}

// ---------- Inicio: se prepara todo antes de que se toque play ----------
(async () => {
  try {
    await buildTimeline();
    ready = true;
  } catch (err) {
    loadFailed = true;
    const h = $("hint");
    h.style.animation = "none";
    h.style.maxWidth = "min(92vw, 560px)";
    h.style.whiteSpace = "normal";
    if (err && err.music) {
      h.textContent = lfsFound
        ? "La música está guardada con Git LFS y GitHub Pages no la publica. Subí musica.mp3 de nuevo sin LFS (arrastrándolo en la web de GitHub)."
        : "No se encontró la música. Subí el archivo al mismo lugar que el index con el nombre exacto musica.mp3, todo en minúsculas y sin tilde.";
      screenText("SIN MÚSICA");
    } else {
      h.textContent = "No se pudieron cargar los archivos. Revisá que el index esté en la misma carpeta que las fotos.";
    }
  }
})();
</script>
</body>
</html>
