<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historia</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; transition: filter 3s ease, transform 3s ease; }
  /* Al aparecer el título, la foto de fondo se va nublando y oscureciendo */
  #stage.blur { filter: blur(26px) brightness(.5); transform: scale(1.12); }
  /* Cada foto entra "enfocándose" (desde borrosa y más clara) y sale desenfocándose */
  .layer { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
           filter: blur(12px) brightness(1.3); transition: opacity 1.3s ease, filter 1.3s ease; }
  .layer.show { opacity: 1; filter: none; }
  /* Copia desenfocada de la foto que rellena las franjas negras de los costados */
  .bg { position: absolute; z-index: 0; inset: -8%; background-size: cover; background-position: center;
        filter: blur(40px) brightness(.45) saturate(1.1); opacity: 0; transition: opacity 1.3s ease; }
  .layer.show + .bg { opacity: 1; }
  /* Ráfaga y montaje final: cortes secos con destello */
  .burst .layer, .burst .bg { transition: none !important; filter: none !important; }
  /* Al adelantar o retroceder, el cambio de foto es rápido */
  .seek .layer, .seek .bg { transition-duration: .25s !important; }
  /* En pausa, también se frena el zoom de las fotos */
  .paused .layer { animation-play-state: paused !important; }
  @keyframes burstPopA { from { transform: scale(1.09) rotate(-.5deg); } to { transform: none; } }
  @keyframes burstPopB { from { transform: scale(1.09) rotate(.5deg); } to { transform: none; } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
  #flash.on { animation: flashSm .22s ease-out; }
  #flash.big { animation: flashBig 1.1s ease-out; }
  @keyframes flashSm { from { opacity: .42; } to { opacity: 0; } }
  @keyframes flashBig { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  /* Grano de película muy suave */
  #grain { position: fixed; inset: -50%; pointer-events: none; z-index: 3; opacity: .06;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
           animation: grain .7s steps(6) infinite; }
  @keyframes grain { 0% { transform: translate(0,0); } 20% { transform: translate(-5%,3%); } 40% { transform: translate(4%,-4%); } 60% { transform: translate(-3%,5%); } 80% { transform: translate(5%,2%); } 100% { transform: translate(0,0); } }
  @keyframes kb1 { from { transform: scale(1) translate(0,0); } to { transform: scale(1.12) translate(-1.5%, -1%); } }
  @keyframes kb2 { from { transform: scale(1.12) translate(1.5%, 1%); } to { transform: scale(1) translate(0,0); } }
  @keyframes kb3 { from { transform: scale(1) translate(0,0); } to { transform: scale(1.1) translate(1.5%, -1%); } }
  @keyframes kb4 { from { transform: scale(1.1) translate(1.5%, 1%); } to { transform: scale(1) translate(-1%, 0); } }
  @keyframes kb5 { from { transform: scale(1) translate(-1.5%, 0); } to { transform: scale(1.11) translate(1.5%, 1%); } }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0b0b; z-index: 10; cursor: pointer; transition: opacity .9s ease; }
  #start.hide { opacity: 0; pointer-events: none; }
  #start.loading { cursor: progress; }
  #start.loading .btn { opacity: .25; pointer-events: none; }
  #start h1 { margin: 0; font-weight: 300; letter-spacing: .3em; text-transform: uppercase; font-size: clamp(1.6rem, 5vw, 3.4rem); }
  #start .btn { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; transition: transform .2s, background .2s; }
  #start:hover .btn { transform: scale(1.08); background: rgba(255,255,255,.12); }
  #start .btn::after { content: ""; border-left: 26px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 8px; }
  #start small { opacity: .55; }
  #warn { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: none; z-index: 7; background: rgba(0,0,0,.75); border: 1px solid rgba(255,255,255,.35); padding: 10px 18px; border-radius: 8px; font-size: 15px; text-align: center; }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; width: 0; background: #fff; opacity: .8; z-index: 5; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transition: opacity .3s; z-index: 6; }
  #controls .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  body.active #controls { opacity: 1; }
  body.idle #controls { opacity: 0; }
  body.idle { cursor: none; }
  #controls button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  #controls button:hover { background: rgba(255,255,255,.25); }
  #seek { width: min(92%, 1100px); height: 18px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  #seekTrack { position: relative; width: 100%; height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; transition: height .15s; }
  #seek:hover #seekTrack { height: 7px; }
  #seekFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; border-radius: 2px; }
  #time { font-size: 13px; opacity: .8; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
  #end { position: fixed; inset: 0; display: none; place-items: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.3), rgba(0,0,0,.7)); z-index: 8; text-align: center; }
  #end h1 { margin: 0; font-weight: 300; text-transform: uppercase; font-size: clamp(1.8rem, 6vw, 4.5rem); letter-spacing: .3em; padding-left: .3em; text-shadow: 0 0 34px rgba(255,255,255,.28); }
  #end.show h1 { animation: titleIn 3s ease .6s both; }
  #end .line { height: 1px; width: 0; margin: 26px auto 0; background: linear-gradient(90deg, transparent, #fff, transparent); }
  #end.show .line { animation: lineGrow 2.4s ease 1.6s both; }
  #end.show button { animation: fadeUp 1.5s ease 3.6s both; }
  @keyframes titleIn { from { opacity: 0; letter-spacing: .75em; transform: scale(.96); filter: blur(8px); } to { opacity: 1; letter-spacing: .3em; transform: none; filter: none; } }
  @keyframes lineGrow { to { width: min(70vw, 560px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes endIn { from { opacity: 0; } to { opacity: 1; } }
  #end.show { display: grid; animation: endIn 1.2s ease both; }
  #end button { margin-top: 16px; background: none; border: 1px solid #fff; color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  /* Intro: cassette, reproductor y zoom a la pantalla */
  #intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden;
           background: radial-gradient(ellipse at 50% 40%, #3a2c20 0%, #1a130d 55%, #080605 100%); transition: opacity 1s ease; }
  #intro.out { opacity: 0; pointer-events: none; }
  #scene { width: min(94vw, 118vh); height: auto; aspect-ratio: 1000 / 800; display: block; touch-action: none; user-select: none; }
  #cassette { cursor: grab; }
  #cassette.grab { cursor: grabbing; }
  #bay.hot { stroke: #ffb44a; stroke-width: 5; }
  .spin .reel { animation: reelSpin 1.4s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes reelSpin { to { transform: rotate(360deg); } }
  #hint { fill: #e9dcc4; font: 600 22px system-ui, sans-serif; letter-spacing: .04em; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  #playBtn { transition: transform .12s; }
  #skip { position: absolute; right: 18px; bottom: 16px; z-index: 2; background: none; border: 1px solid rgba(255,255,255,.3);
          color: rgba(255,255,255,.7); border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  #skip:hover { background: rgba(255,255,255,.12); }
</style>
</head>
<body>
<div id="stage">
  <img class="layer" id="a" alt=""><div class="bg"></div>
  <img class="layer" id="b" alt=""><div class="bg"></div>
  <video class="layer" id="v" muted playsinline></video>
</div>
<div id="vignette"></div>
<div id="grain"></div>

<div id="controls">

  <div class="row">
    <button id="back">⏪ 10 s</button>

        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="1" result="n">
          <animate attributeName="seed" values="1;5;9;13;17;21" dur=".4s" repeatCount="indefinite" calcMode="discrete"/>
        </feTurbulence>
        <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -.1  1.6 0 0 0 -.1  1.6 0 0 0 -.1  0 0 0 0 1"/>

      <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>

    <!-- Reproductor -->

    <rect x="270" y="48" width="22" height="20" fill="#1d1e21"/><rect x="708" y="48" width="22" height="20" fill="#1d1e21"/>
    <rect x="40" y="60" width="920" height="500" rx="46" fill="url(#gBody)" stroke="#0d0d0e" stroke-width="3"/>
    <rect x="110" y="556" width="90" height="14" rx="6" fill="#111"/><rect x="800" y="556" width="90" height="14" rx="6" fill="#111"/>
    <g id="spkL">
      <circle cx="190" cy="310" r="125" fill="#141517" stroke="#5a5e65" stroke-width="3"/>
      <circle cx="190" cy="310" r="102" fill="none" stroke="#2c2f34" stroke-width="7"/>
      <circle cx="190" cy="310" r="76" fill="none" stroke="#2c2f34" stroke-width="7"/>
      <circle cx="190" cy="310" r="50" fill="none" stroke="#2c2f34" stroke-width="7"/>
      <circle cx="190" cy="310" r="22" fill="#0b0c0d" stroke="#3a3d42" stroke-width="3"/>
    </g>
    <use href="#spkL" transform="translate(620 0)"/>
    <rect x="335" y="80" width="330" height="460" rx="22" fill="url(#gPlate)" stroke="#5c6067" stroke-width="2"/>
    <text x="500" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#2a2c30">STEREO CASSETTE</text>
    <circle id="led1" cx="362" cy="97" r="4.5" fill="#ff3b30"/>
    <circle id="led2" cx="638" cy="97" r="4.5" fill="#2a3a2c"/>

    <!-- Pantalla -->
    <rect x="350" y="112" width="300" height="178" rx="16" fill="#0b0c0d" stroke="#3b3e44" stroke-width="2"/>
    <rect id="screenRect" x="361" y="123" width="278" height="156" rx="10" fill="url(#gScreen)"/>
    <g clip-path="url(#screenClip)">
      <text id="screenText" class="blink" x="500" y="208" text-anchor="middle" font-family="'Courier New',monospace" font-size="21" font-weight="700" fill="#8dffb8">INSERTE CASSETTE</text>
      <rect id="noise" x="361" y="123" width="278" height="156" filter="url(#noiseF)" opacity="0"/>

    <!-- Compartimento del cassette -->
    <rect id="bay" x="355" y="305" width="290" height="150" rx="12" fill="#0a0a0b" stroke="#454850" stroke-width="3"/>
    <g id="bayLayer"></g>
    <rect x="355" y="305" width="290" height="150" rx="12" fill="url(#gGlass)" pointer-events="none"/>

    <!-- Botones -->
    <g stroke="#111" stroke-width="2">
      <rect x="355" y="472" width="52" height="38" rx="6" fill="#2b2d31"/>
      <rect x="414.5" y="472" width="52" height="38" rx="6" fill="#2b2d31"/>
      <rect x="533.5" y="472" width="52" height="38" rx="6" fill="#2b2d31"/>
      <rect x="593" y="472" width="52" height="38" rx="6" fill="#2b2d31"/>
    </g>
    <g fill="#d9dce0">
      <path d="M386 483 L374 491 L386 499 Z M398 483 L386 491 L398 499 Z"/>
      <path d="M435 483 L447 491 L435 499 Z M447 483 L459 491 L447 499 Z"/>
      <rect x="553" y="485" width="13" height="13"/>
      <path d="M619 482 L629 492 H609 Z M609 495 h20 v4 h-20 z"/>
    </g>
    <g id="playBtn">
      <rect x="474" y="472" width="52" height="38" rx="6" fill="#2b2d31" stroke="#ff9a3c" stroke-width="2.5"/>
      <path d="M493 482 L510 491 L493 500 Z" fill="#ff9a3c"/>
    </g>

    <!-- Cassette -->
    <g id="topLayer">
      <g id="cassette" transform="translate(500 680) rotate(-4) scale(1)">
        <rect x="-130" y="-82" width="260" height="164" rx="12" fill="#161616" stroke="#000" stroke-width="2"/>
        <rect x="-118" y="-72" width="236" height="104" rx="8" fill="#efe6cf"/>
        <rect x="-118" y="-72" width="236" height="26" rx="8" fill="#d94b2b"/>
        <text x="0" y="-53" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#fff">HISTORIA</text>
        <text x="0" y="-20" text-anchor="middle" font-family="'Segoe Script','Bradley Hand','Comic Sans MS',cursive" font-size="21" fill="#222" textLength="190" lengthAdjust="spacingAndGlyphs">Historia Argentina</text>
        <rect x="-70" y="-12" width="140" height="42" rx="21" fill="#2a2a2a" stroke="#777" stroke-width="2"/>
        <g transform="translate(-36 9)"><g class="reel"><circle r="15" fill="#e9e9e9"/><circle r="6" fill="#222"/><g stroke="#222" stroke-width="3"><line x1="-15" y1="0" x2="15" y2="0"/><line x1="-7.5" y1="-13" x2="7.5" y2="13"/><line x1="-7.5" y1="13" x2="7.5" y2="-13"/></g></g></g>
        <g transform="translate(36 9)"><g class="reel"><circle r="15" fill="#e9e9e9"/><circle r="6" fill="#222"/><g stroke="#222" stroke-width="3"><line x1="-15" y1="0" x2="15" y2="0"/><line x1="-7.5" y1="-13" x2="7.5" y2="13"/><line x1="-7.5" y1="13" x2="7.5" y2="-13"/></g></g></g>
        <path d="M-92 82 L-78 48 L78 48 L92 82 Z" fill="#2b2b2b" stroke="#000" stroke-width="2"/>
        <circle cx="-56" cy="66" r="6" fill="#0a0a0a"/><circle cx="56" cy="66" r="6" fill="#0a0a0a"/>
        <circle cx="-118" cy="-70" r="3" fill="#555"/><circle cx="118" cy="-70" r="3" fill="#555"/>

<div id="end"><div><h1>Historia Argentina</h1><div class="line"></div><button id="again">Ver de nuevo</button></div></div>

<audio id="music" src="musica.mp3" preload="auto"></audio>

<script>
// Orden y nombres tal como aparecen en la carpeta.
const FILES = [
  "1","1,2.png","1,4.png","1,5.png","2.jpg","3.jpg","4.jpg","5..jpg","6.jpg","7,1.jpg","7,5.png","8.jpg","8,5.jpg","9.jpg",
  "10.jpg","11.jpg","12.jpg","13.jpg","14.jpg","15.jpg","16.jpg","17.jpg","18..jpg","19.png","20.jpg",
  "21.jpg","22.jpg","22,5.mp4","23.jpg","24.jpg","25.jpg","26.jpg","segundovideo.mp4","27.jpg","28.jpg","29.jpg","30.jpg","31.png",
  "32.jpg","33.jpg","34.jpg","35.jpg","36.jpg","37.jpg"
];

// ---------- Tiempos (en segundos de la música) ----------
const SLIDE_S = 3.8;                                   // duración normal de cada foto
const BURST_AT = 53, BURST_END = 65;                   // ráfaga: de 0:53 a 1:05
const V1_NAME = "22,5.mp4", V1_AT = 93;                // primer video: 1:33
const V2_NAME = "segundovideo.mp4", V2_AT = 171;       // segundo video: 2:51
const DUCK_V2 = 0.15;                                  // volumen de la música durante el segundo video
const MONTAGE_S = 11;                                  // montaje final acelerado
const BURST = Array.from({ length: 41 }, (_, k) => "rafaga " + (k + 1) + ".png");   // las que no existan se saltean
const AFTER_MAX = 30;                                  // despuesdelsegundovideo1..30 (las que no existan se saltean)
const KB = ["kb1", "kb2", "kb3", "kb4", "kb5"];

// ---------- Carga de archivos ----------
// Si un nombre exacto no existe, prueba variantes (.jpg, .png, .jpeg, ..jpg)
function candidates(name) {
  if (/\.mp4$/i.test(name)) return [name, name.replace(/\.mp4$/i, ".MP4")];
  const m = name.match(/^(\d+(?:,\d+)?)/);
  const base = m ? m[1] : name;
  const list = [name, base + ".jpg", base + ".png", base + ".jpeg", base + "..jpg", base + ".JPG", base + ".PNG", base + "jpg"];
  return [...new Set(list)];
}

function tryLoad(url) {
  return new Promise(res => {
    if (/\.mp4$/i.test(decodeURIComponent(url))) {
      const v = document.createElement("video");
      v.preload = "metadata";
      v.onloadedmetadata = () => res(true);
      v.onerror = () => res(false);
      v.src = url;
      return;
    }
    const im = new Image();
    im.onload = () => res(true);
    im.onerror = () => res(false);
    im.src = url;
  });
}

function videoDuration(url) {
  return new Promise(res => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.onloadedmetadata = () => res(isFinite(v.duration) && v.duration > 0 ? v.duration : null);
    v.onerror = () => res(null);
    v.src = url;
    setTimeout(() => res(null), 4000);
  });
}

const cache = new Map();
function resolve(i) {
  if (cache.has(i)) return cache.get(i);
  const p = (async () => {
    for (const c of candidates(FILES[i])) {
      const url = encodeURIComponent(c);
      if (await tryLoad(url)) return url;
    }
    return null;
  })();
  cache.set(i, p);
  return p;
}

let burstP = null, afterP = null;
function loadBurst() {
  if (!burstP) {
    burstP = Promise.all(BURST.map(async n => {
      for (const c of [n, n.replace(/\.png$/, ".jpg")]) {
        const u = encodeURIComponent(c);
        if (await tryLoad(u)) return u;
      }
      return null;
    })).then(a => a.filter(Boolean));
  }
  return burstP;
}
function loadAfter() {
  if (!afterP) {
    afterP = Promise.all(Array.from({ length: AFTER_MAX }, async (_, k) => {
      const n = k + 1;
      const names = [
        "despuesdelsegundovideo" + n + ".png",
        "despuesdelsegundo video" + n + ".png",
        "despuesdelsegundo_video" + n + ".png",
        "despuesdelsegundovideo" + n + ".jpg"
      ];
      for (const c of names) {
        const u = encodeURIComponent(c);
        if (await tryLoad(u)) return u;
      }
      return null;
    })).then(a => a.filter(Boolean));
  }
  return afterP;
}

// ---------- Elementos ----------
const $ = id => document.getElementById(id);
const layers = [$("a"), $("b")];
const vid = $("v");
const music = $("music");
const stage = $("stage");

// Cada foto tiene detrás una copia desenfocada que rellena las franjas negras
const bgObserver = new MutationObserver(list => list.forEach(m => {
  const bg = m.target.nextElementSibling;
  if (bg && bg.classList.contains("bg")) bg.style.backgroundImage = 'url("' + m.target.getAttribute("src") + '")';
}));
layers.forEach(l => bgObserver.observe(l, { attributes: true, attributeFilter: ["src"] }));

// Golpe de cada foto de la ráfaga: pequeño zoom con giro alternado y destello
function punch(el, k, quiet) {
  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = (k % 2 ? "burstPopA" : "burstPopB") + " .34s cubic-bezier(.2,.8,.2,1) both";
  if (quiet) return;   // en el montaje muy rápido no hay destello en cada foto (evita el parpadeo)
  const f = $("flash");
  if (f.classList.contains("big")) return;   // el destello grande tiene prioridad
  f.classList.remove("on");
  void f.offsetWidth;
  f.classList.add("on");
}
// Destello blanco grande
function bigFlash() {
  const f = $("flash");
  f.classList.remove("on", "big");
  void f.offsetWidth;
  f.classList.add("big");
}
$("flash").addEventListener("animationend", () => $("flash").classList.remove("on", "big"));

// ---------- Línea de tiempo ----------
// Todo lo que se ve depende solo del tiempo de la música: así se puede adelantar y
// retroceder sin que las fotos ni los videos se desfasen.
let segs = [], D = 240, ready = false;

async function buildTimeline() {
  if (!(music.readyState >= 1)) {
    await new Promise(r => { music.addEventListener("loadedmetadata", r, { once: true }); setTimeout(r, 4000); });
  }
  D = (isFinite(music.duration) && music.duration > 0) ? music.duration : 240;

  await Promise.all(FILES.map((_, i) => resolve(i)));
  const burstUrls = await loadBurst();
  const afterList = await loadAfter();

  const i1 = FILES.indexOf(V1_NAME), i2 = FILES.indexOf(V2_NAME);
  const before = [], later = [], all = [];
  for (let i = 0; i < FILES.length; i++) {
    if (/\.mp4$/i.test(FILES[i])) continue;
    const u = await resolve(i);
    if (!u) continue;
    all.push(u);
    (i < i1 ? before : later).push(u);
  }
  const v1u = await resolve(i1), v2u = await resolve(i2);
  const d1 = v1u ? await videoDuration(v1u) : null;
  const d2 = v2u ? await videoDuration(v2u) : null;
  const v1 = (v1u && d1) ? { url: v1u, dur: d1 } : null;
  const v2 = (v2u && d2) ? { url: v2u, dur: d2 } : null;

  const out = [];
  let flagAfterBurst = false;
  const photo = (url, s, e) => {
    const seg = { type: "photo", url, start: s, end: e };
    if (flagAfterBurst) { seg.afterBurst = true; flagAfterBurst = false; }
    out.push(seg);
  };
  const holdLast = until => {
    const l = out[out.length - 1];
    if (l && l.type === "photo" && l.end < until) l.end = until;
  };

  // 1) Fotos hasta el primer video, con la ráfaga en 0:53–1:05
  const burstLen = BURST_END - BURST_AT;
  let burstDone = !burstUrls.length;
  const addBurst = () => {
    const step = burstLen / burstUrls.length;
    burstUrls.forEach((u, k) => out.push({
      type: "burst", url: u, k, start: BURST_AT + k * step, end: BURST_AT + (k + 1) * step, first: k === 0
    }));
    burstDone = true;
    flagAfterBurst = true;
  };
  let t = 0;
  const N = before.length;
  let per = (V1_AT - (burstDone ? 0 : burstLen)) / Math.max(1, N);
  for (let j = 0; j < N; j++) {
    if (!burstDone && t >= BURST_AT - 1e-6) { addBurst(); t = BURST_END; per = (V1_AT - t) / (N - j); }
    const s = t;
    let e = t + per;
    if (!burstDone && e > BURST_AT) e = BURST_AT;
    photo(before[j], s, e);
    t = e;
  }
  if (!burstDone) {
    addBurst(); t = BURST_END;
    if (N) photo(before[N - 1], t, V1_AT);
  }
  holdLast(V1_AT);

  // 2) Primer video en 1:33
  t = V1_AT;
  if (v1) { out.push({ type: "video", url: v1.url, start: V1_AT, end: V1_AT + v1.dur }); t = V1_AT + v1.dur; }
  const v2At = Math.max(V2_AT, t);

  // 3) Fotos hasta el segundo video
  let jR = 0;
  while (jR < later.length && t < v2At - 1e-6) {
    const e = Math.min(t + SLIDE_S, v2At);
    photo(later[jR], t, e); t = e; jR++;
  }
  holdLast(v2At);

  // 4) Segundo video en 2:51 (la música baja)
  t = v2At;
  if (v2) { out.push({ type: "video", url: v2.url, start: v2At, end: v2At + v2.dur, duck: true }); t = v2At + v2.dur; }

  // 5) Todas las fotos de "despuesdelsegundovideo": si falta tiempo, pasan más rápido (mínimo 0,45 s)
  const F = D - (MONTAGE_S + 0.7 + 4.5);              // hora en que debería arrancar el final
  if (afterList.length) {
    const per2 = Math.min(SLIDE_S, Math.max(0.45, (F - t - 0.5) / afterList.length));
    afterList.forEach(u => { photo(u, t, t + per2); t += per2; });
  }
  const Fe = Math.max(F, t);

  // 6) Fotos normales que quedan, hasta el final
  while (jR < later.length && t < Fe - 1e-6) {
    const e = Math.min(t + SLIDE_S, Fe);
    photo(later[jR], t, e); t = e; jR++;
  }
  holdLast(Fe);

  // 7) Montaje final: cada vez más rápido, repitiendo fotos si hace falta.
  //    No se detiene: sigue a ritmo rápido mientras aparece el título y el fondo se nubla.
  const Ms = Math.max(3, Math.min(MONTAGE_S, D - Fe - 5.2));
  const pool = [...all, ...burstUrls, ...afterList];
  const dMin = 0.06;                                   // ritmo final: una foto cada 0,06 s
  const total = Math.max(Ms + 1, D + 1 - Fe);
  let k = 0, tm = 0;
  while (tm < total) {
    const d = tm < Ms ? 0.45 * Math.pow(dMin / 0.45, tm / Ms) : dMin;
    out.push({
      type: "montage", url: pool.length ? pool[k % pool.length] : null, k,
      start: Fe + tm, end: Fe + tm + d, title: tm >= Ms - 1e-6   // title: ya se ve el título con el fondo nublado
    });
    tm += d; k++;
  }

  out.sort((x, y) => x.start - y.start);
  out.forEach((s, idx) => { s.id = idx; });
  segs = out;
}

function findSeg(t) {
  let lo = 0, hi = segs.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (segs[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return segs[ans];
}

// ---------- Dibujar ----------
let curSeg = null, frontEl = null, lastT = -999, playing = false, active = false, seekT = null;

function showOnly(el) {
  [layers[0], layers[1], vid].forEach(x => { if (x === el) x.classList.add("show"); else x.classList.remove("show"); });
}
function unblur() {
  stage.style.transition = "none";
  stage.classList.remove("blur");
  void stage.offsetWidth;
  stage.style.transition = "";
}

function checkVideoAudio() {
  if (!curSeg || curSeg.type !== "video") return;
  let msg = "";
  if (vid.muted && !music.muted) {
    msg = "El navegador bloqueó el sonido del video. Hacé clic en la pantalla para activarlo.";
  } else if (vid.mozHasAudio === false ||
             (typeof vid.webkitAudioDecodedByteCount === "number" && !vid.paused &&
              vid.currentTime > 1 && vid.webkitAudioDecodedByteCount === 0)) {
    msg = "Este video no tiene audio o el navegador no puede reproducirlo.";
  }
  const w = $("warn");
  w.textContent = msg;
  w.style.display = msg ? "block" : "none";
}

function applySeg(seg, t, jump) {
  const prev = curSeg;
  curSeg = seg;
  $("warn").style.display = "none";
  if (jump) {
    stage.classList.add("seek");
    clearTimeout(seekT);
    seekT = setTimeout(() => stage.classList.remove("seek"), 450);
  }
  const isFrame = seg.type === "burst" || seg.type === "montage";
  stage.classList.toggle("burst", isFrame);
  if (!seg.title) {
    if (stage.classList.contains("blur")) unblur();
    $("end").classList.remove("show");
  }
  if (prev && prev.type === "video" && seg.type !== "video") {
    setTimeout(() => { if (!curSeg || curSeg.type !== "video") vid.pause(); }, 700);
  }

  if (seg.type === "photo") {
    const dur = Math.max(2, seg.end - seg.start) + 2.5;
    const el = (frontEl === layers[0]) ? layers[1] : layers[0];
    el.style.animation = "none";
    el.src = seg.url;
    void el.offsetWidth;
    // el zoom arranca en el punto que corresponde al tiempo actual (así también sirve al adelantar o retroceder)
    el.style.animation = KB[seg.id % KB.length] + " " + dur + "s ease-out " + (-(t - seg.start)) + "s forwards";
    showOnly(el);
    frontEl = el;
    if (seg.afterBurst && prev && prev.type === "burst" && !jump) bigFlash();   // destello al cerrar la ráfaga
  } else if (seg.type === "video") {
    if (vid.dataset.url !== seg.url) { vid.src = seg.url; vid.dataset.url = seg.url; }
    vid.muted = music.muted;
    vid.volume = 1;
    try { vid.currentTime = Math.max(0, t - seg.start); } catch (e) {}
    if (playing) vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
    showOnly(vid);
    frontEl = vid;
    setTimeout(checkVideoAudio, 1800);
  } else if (isFrame) {
    const a = layers[0];
    if (seg.url) a.src = seg.url;
    showOnly(a);
    frontEl = a;
    const quiet = seg.title || (seg.end - seg.start) < 0.12;
    if (seg.first && !jump) bigFlash(); else punch(a, seg.k, quiet);   // destello al abrir la ráfaga
    if (seg.title) {
      // aparece el título y el fondo se va nublando mientras las fotos siguen cambiando
      stage.classList.add("blur");
      $("end").classList.add("show");
      if (prev && !prev.title && !jump) bigFlash();
    }
  }
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function tick() {
  if (!active || !segs.length) return;
  const t = Math.min(D, music.currentTime);
  const seg = findSeg(t);
  const jump = Math.abs(t - lastT) > 0.8;
  if (seg !== curSeg) applySeg(seg, t, jump);
  lastT = t;

  // El video se mantiene alineado con la música
  if (curSeg && curSeg.type === "video") {
    const want = t - curSeg.start;
    if (Math.abs(vid.currentTime - want) > 0.6) { try { vid.currentTime = want; } catch (e) {} }
    if (playing) { if (vid.paused && want < (vid.duration || Infinity) - 0.05) vid.play().catch(() => {}); }
    else if (!vid.paused) vid.pause();
  }

  // Volumen de la música: baja durante el segundo video y se apaga suave al final
  let target = (curSeg && curSeg.duck) ? DUCK_V2 : 1;
  const rem = D - t;
  if (rem < 3) target *= Math.max(0, rem / 3);
  music.volume = Math.max(0, Math.min(1, music.volume + (target - music.volume) * 0.25));

  const pct = (t / D * 100) + "%";
  $("seekFill").style.width = pct;
  $("bar").style.width = pct;
  $("time").textContent = fmt(t) + " / " + fmt(D);
}
setInterval(tick, 30);

// ---------- Control de reproducción ----------
function seekTo(t) {
  t = Math.max(0, Math.min(D - 0.05, t));
  music.currentTime = t;
  if (playing && music.paused) music.play().catch(() => {});
  lastT = -999;   // fuerza un cambio rápido de foto
  tick();
}
function pause() {
  playing = false;
  music.pause();
  vid.pause();
  stage.classList.add("paused");
  $("pp").textContent = "▶ Reanudar";
}
function resume() {
  if (music.ended || music.currentTime >= D - 0.1) { seekTo(0); }
  playing = true;
  stage.classList.remove("paused");
  music.play().catch(() => {});
  if (curSeg && curSeg.type === "video") vid.play().catch(() => {});
  $("pp").textContent = "⏸ Pausa";
}
function begin() {
  $("intro").classList.add("out");
  $("end").classList.remove("show");
  document.body.classList.add("active");
  unblur();
  stage.classList.remove("paused", "burst");
  showOnly(null);
  curSeg = null; frontEl = null; lastT = -999;
  playing = true; active = true;
  music.volume = 1;
  music.currentTime = 0;
  music.play().catch(() => {});
  $("pp").textContent = "⏸ Pausa";
  tick();
}

$("again").onclick = () => begin();
$("pp").onclick = () => playing ? pause() : resume();
$("back").onclick = () => seekTo(music.currentTime - 10);
$("fwd").onclick = () => seekTo(music.currentTime + 10);
$("mute").onclick = () => { music.muted = !music.muted; vid.muted = music.muted; $("mute").textContent = music.muted ? "🔇" : "🔊"; };
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

// Barra para adelantar / retroceder (clic o arrastrar)
const seekEl = $("seek");
let dragging = false;
function seekFromEvent(e) {
  const r = seekEl.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  seekTo(x * D);
}
seekEl.addEventListener("pointerdown", e => { dragging = true; seekEl.setPointerCapture(e.pointerId); seekFromEvent(e); });
seekEl.addEventListener("pointermove", e => { if (dragging) seekFromEvent(e); });
seekEl.addEventListener("pointerup", () => { dragging = false; });
seekEl.addEventListener("pointercancel", () => { dragging = false; });

// Un clic en la pantalla activa el sonido del video si el navegador lo bloqueó; si no, pausa o reanuda
stage.addEventListener("click", () => {
  if (curSeg && curSeg.type === "video" && vid.muted && !music.muted) {
    vid.muted = false;
    vid.play().catch(() => {});
    $("warn").style.display = "none";
  } else if (active && curSeg && !curSeg.title) {
    $("pp").click();
  }
});

document.addEventListener("keydown", e => {
  if (!active) { if ((e.key === "Enter" || e.key === " ") && !introBusy) { e.preventDefault(); insertSequence(); } return; }
  if (e.key === " ") { e.preventDefault(); $("pp").click(); }
  if (e.key === "ArrowRight") seekTo(music.currentTime + 5);
  if (e.key === "ArrowLeft") seekTo(music.currentTime - 5);
  if (e.key === "f" || e.key === "F") $("fs").click();
  if (e.key === "m" || e.key === "M") $("mute").click();
});

// Oculta controles tras unos segundos sin mover el mouse
let idleT;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("idle");
  clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add("idle"), 3000);
});

// ---------- Intro: se pone el cassette en el reproductor, zoom a la pantalla y empieza ----------
let introBusy = false, loadFailed = false, audioUnlocked = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const scene = $("scene"), cassette = $("cassette");
const HOME = { x: 500, y: 680, r: -4, s: 1 };       // dónde está el cassette al principio
const BAY = { x: 500, y: 380 };                     // centro del compartimento del reproductor
let cass = { ...HOME };

function setCass(c) {
  cassette.setAttribute("transform", "translate(" + c.x + " " + c.y + ") rotate(" + c.r + ") scale(" + c.s + ")");
}
const easeInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function tween(to, ms) {
  const from = { ...cass };
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - t0) / ms), e = easeInOut(p);
      cass = {
        x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e,
        r: from.r + (to.r - from.r) * e, s: from.s + (to.s - from.s) * e
      };
      setCass(cass);
      if (p < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
function svgPoint(e) {
  const pt = scene.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(scene.getScreenCTM().inverse());
}
function screenText(t) {
  const el = $("screenText");
  el.textContent = t;
  el.classList.remove("blink");
}

// Sonidos simples hechos con el navegador (sin archivos extra)
let AC = null;
function actx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, delay) {
  const c = actx();
  if (!c || music.muted) return;
  const o = c.createOscillator(), g = c.createGain();
  const t = c.currentTime + (delay || 0);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, rise) {
  const c = actx();
  if (!c || music.muted) return;
  const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = c.createGain(); const t = c.currentTime;
  if (rise) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + rise);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
  } else {
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t);
}
const sfx = {
  slide: () => noise(.25, .12, 900),
  clack: () => { noise(.07, .35, 2500); tone(160, .09, "square", .12); },
  play: () => { noise(.06, .45, 1800); tone(95, .14, "square", .18); tone(260, .05, "square", .06, .02); },
  whir: () => noise(2.6, .12, 500, 1.2)
};

// Prepara la música en el primer toque (algunos navegadores lo exigen)
function unlockAudio() {
  actx();
  if (audioUnlocked) return;
  audioUnlocked = true;
  music.volume = 0;
  music.play().then(() => { music.pause(); music.currentTime = 0; }).catch(() => {}).finally(() => { music.volume = 1; });
}

// El zoom: la pantalla del reproductor crece hasta ocupar toda la ventana
function zoomToScreen() {
  return new Promise(res => {
    const sr = $("screenRect").getBoundingClientRect();
    const br = scene.getBoundingClientRect();
    const VW = window.innerWidth, VH = window.innerHeight;
    const s = Math.max(VW / sr.width, VH / sr.height) * 1.08;
    const cx = sr.left + sr.width / 2 - br.left, cy = sr.top + sr.height / 2 - br.top;
    const tx = VW / 2 - br.left - s * cx, ty = VH / 2 - br.top - s * cy;
    scene.style.transformOrigin = "0 0";
    scene.style.transition = "transform 2.6s cubic-bezier(.6,0,.2,1)";
    scene.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + s + ")";
    sfx.whir();
    const nz = $("noise");
    nz.style.transition = "opacity 2.2s ease .3s";
    nz.style.opacity = ".85";
    setTimeout(res, 2700);
  });
}

async function insertSequence() {
  if (introBusy) return;
  introBusy = true;
  unlockAudio();
  $("hint").style.display = "none";
  $("skip").style.display = "none";
  $("bay").classList.remove("hot");
  // 1) el cassette se acomoda sobre la ranura
  await tween({ x: BAY.x, y: BAY.y - 70, r: 0, s: 0.95 }, 380);
  // 2) entra en el compartimento, detrás del vidrio
  $("bayLayer").appendChild(cassette);
  cassette.style.cursor = "default";
  sfx.slide();
  await tween({ x: BAY.x, y: BAY.y, r: 0, s: 0.85 }, 420);
  sfx.clack();
  $("led2").setAttribute("fill", "#46ff7a");
  screenText("CASSETTE OK");
  // 3) si todavía se están cargando las fotos, espera
  if (!ready && !loadFailed) {
    screenText("CARGANDO…");
    while (!ready && !loadFailed) await sleep(150);
  }
  if (loadFailed) { screenText("ERROR"); $("hint").style.display = ""; return; }
  await sleep(500);
  // 4) se aprieta PLAY y giran los carretes
  $("playBtn").style.transform = "translateY(4px)";
  sfx.play();
  scene.classList.add("spin");
  screenText("▶ PLAY");
  await sleep(1000);
  // 5) zoom a la pantalla y empieza
  await zoomToScreen();
  begin();
}

async function skipIntro() {
  if (introBusy) return;
  introBusy = true;
  unlockAudio();
  $("skip").style.display = "none";
  while (!ready && !loadFailed) await sleep(150);
  if (ready) begin();
}
$("skip").onclick = skipIntro;

// Arrastrar el cassette (o tocarlo) para ponerlo en el reproductor
let drag = null;
cassette.addEventListener("pointerdown", e => {
  if (introBusy) return;
  e.preventDefault();
  unlockAudio();
  const p = svgPoint(e);
  drag = { dx: cass.x - p.x, dy: cass.y - p.y, sx: e.clientX, sy: e.clientY, moved: false };
  cassette.setPointerCapture(e.pointerId);
  cassette.classList.add("grab");
  $("hint").style.display = "none";
});
cassette.addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
  const p = svgPoint(e);
  cass = { x: p.x + drag.dx, y: p.y + drag.dy, r: cass.r * 0.85, s: 1 };
  setCass(cass);
  $("bay").classList.toggle("hot", Math.hypot(cass.x - BAY.x, cass.y - BAY.y) < 190);
});
async function endDrag() {
  if (!drag) return;
  const d = drag;
  drag = null;
  cassette.classList.remove("grab");
  if (!d.moved) return insertSequence();   // un toque alcanza: se inserta solo
  if (Math.hypot(cass.x - BAY.x, cass.y - BAY.y) < 190) return insertSequence();
  $("bay").classList.remove("hot");
  await tween(HOME, 450);
  $("hint").style.display = "";
}
